mutation DeleteRecipe($id: RecipeId!) {
  deleteRecipe(id: $id)
}

mutation DeleteVersion($recipeId: RecipeId!, $number: VersionNumber!) {
  deleteVersion(recipeId: $recipeId, number: $number)
}

mutation CopyVersion($recipeId: RecipeId!, $number: VersionNumber!, $title: RecipeTitle!) {
  copyVersion(recipeId: $recipeId, number: $number, title: $title) {
    id
  }
}

mutation UpdateFavorite($recipeId: RecipeId!, $versionNumber: VersionNumber!, $favorite: Boolean!) {
  updateFavorite(recipeId: $recipeId, versionNumber: $versionNumber, favorite: $favorite) {
    ...VersionFields
  }
}

mutation LinkComponent($recipeId: RecipeId!, $component: RecipeId!, $scale: ComponentScale!) {
  linkComponent(recipeId: $recipeId, component: $component, scale: $scale) {
    id
  }
}

mutation UnlinkComponent($recipeId: RecipeId!, $component: RecipeId!) {
  unlinkComponent(recipeId: $recipeId, component: $component) {
    id
  }
}

# The edit sheet, saved whole: whatever the cook moved on the recipe and on the
# version shown, in one transaction — never one round trip per field.
mutation CorrectVersion(
  $recipeId: RecipeId!
  $versionNumber: VersionNumber!
  $input: CorrectionInput!
) {
  correctVersion(recipeId: $recipeId, versionNumber: $versionNumber, input: $input) {
    number
  }
}
