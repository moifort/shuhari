query RecipeList(
  $types: [RecipeType!]
  $category: DishCategory
  $method: BrewMethod
  $sort: RecipeSort
  $order: SortOrder
  $limit: Int
  $after: RecipeId
) {
  recipes(
    types: $types
    category: $category
    method: $method
    sort: $sort
    order: $order
    limit: $limit
    after: $after
  ) {
    items {
      id
      title
      category
      method
      tags {
        label
        icon
      }
      favorite
      updatedAt
      versionCount
      toTestCount
      bestRating
    }
    hasMore
    totalCount
  }
}
